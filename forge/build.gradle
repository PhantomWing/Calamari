plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

architectury {
    platformSetupLoomIde()
    forge()
}

// Resolved outside the loom { runs { } } closures so the data-generation paths
// are available to the RunConfigSettings delegate.
def datagenModId = rootProject.property('mod_id').toString()
def datagenOutput = rootProject.file('common/src/generated/resources/').absolutePath
def datagenExisting = rootProject.file('common/src/main/resources/').absolutePath

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    forge {
        // The loader module builds against Forge on 1.20.1; the common access
        // widener is converted into a Forge access transformer at build time.
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
    }

    // Register the mod (and its source set) with the dev runtime, so Forge wires up
    // the mod event bus during mod construction.
    mods {
        register('calamari') {
            sourceSet sourceSets.main
        }
    }

    runs {
        // Forge data generation. Output + existing-resource paths point at the
        // common source set (datagen output is shared across loaders).
        //   ./gradlew :forge:runData
        data {
            data()
            name = "Data Generation"
            programArgs('--mod', datagenModId, '--all', '--output', datagenOutput, '--existing', datagenExisting)
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
    // Architectury API (Forge).
    modApi "dev.architectury:architectury-forge:${rootProject.architectury_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionForge')) { transitive false }

    // ---- Dev-runtime niceties (modLocalRuntime ONLY — never compiled against,
    //      never shipped, never a hard dependency). ----
    modLocalRuntime("mezz.jei:jei-1.20.1-forge:${rootProject.jei_version}")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

shadowJar {
    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = "${rootProject.mod_id}-forge"
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}

// ---- Modrinth + CurseForge publishing (Forge jar, also serves NeoForge 1.20.1) ----
//
// Its own version per platform, requiring only architectury-api. The version number
// is suffixed `+forge` to stay unique against the Fabric version under the same
// project. Dry-run unless a token is set.
apply plugin: 'me.modmuss50.mod-publish-plugin'

publishMods {
    type = STABLE
    file = remapJar.archiveFile
    version = "${rootProject.mod_version}+forge"
    changelog = rootProject.ext.latestChangelog()
    // Real publish by default; pass -PpublishDryRun to stage without uploading.
    dryRun = project.hasProperty("publishDryRun")
    modLoaders.add("forge")
    modLoaders.add("neoforge")

    modrinth {
        projectId = providers.gradleProperty("modrinth_project_id")
                .orElse(providers.environmentVariable("MODRINTH_PROJECT_ID")).orElse("PLACEHOLDER")
        accessToken = providers.environmentVariable("MODRINTH_TOKEN").orElse(providers.gradleProperty("modrinth_token"))
        displayName = "Calamari ${rootProject.mod_version}"
        minecraftVersions.add(rootProject.minecraft_version)
        requires("architectury-api")
    }

    curseforge {
        projectId = providers.gradleProperty("curseforge_project_id")
                .orElse(providers.environmentVariable("CURSEFORGE_PROJECT_ID")).orElse("PLACEHOLDER")
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse(providers.gradleProperty("curseforge_token"))
        displayName = "Calamari ${rootProject.mod_version}"
        minecraftVersions.add(rootProject.minecraft_version)
        // CurseForge needs explicit side flags (Modrinth uses the project setting).
        client = true
        server = true
        requires("architectury-api")
    }
}
