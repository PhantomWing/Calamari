plugins {
    id 'architectury-plugin' version "${architectury_plugin_version}"
    id 'dev.architectury.loom' version "${architectury_loom_version}" apply false
    id 'me.modmuss50.mod-publish-plugin' version '2.0.0' apply false
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Per-release changelog: the notes under the first "# X.Y.Z" header in changelog.md,
// up to the next "# " — used as the Modrinth/CurseForge changelog for each upload.
ext.latestChangelog = {
    def f = rootProject.file('changelog.md')
    if (!f.exists()) return "See changelog.md"
    def body = new StringBuilder()
    boolean started = false, done = false
    f.eachLine { line ->
        if (done) return
        if (line.startsWith('# ')) {
            if (started) { done = true; return }
            started = true
            return
        }
        if (started) body.append(line).append('\n')
    }
    def out = body.toString().trim()
    return out.isEmpty() ? "See changelog.md" : out
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        // Mojang official mappings, layered with Parchment.
        mappings loom.layered {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
        }
    }
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "${mod_id}-${project.name}-${minecraft_version}"
    }

    version = mod_version
    group = mod_group_id

    repositories {
        mavenLocal()

        // MinecraftForge (the loader module builds against Forge on 1.20.1).
        maven { url = 'https://maven.minecraftforge.net/' }
        // Architectury API.
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.parchmentmc.org' }

        // AppleSkin (dev-runtime only)
        maven {
            url = "https://maven.ryanliptak.com/"
        }

        // JEI (dev-runtime only)
        maven {
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }
        maven {
            name = "ModMaven"
            url = "https://modmaven.dev"
        }

        // Cloth Config — a real (shipped) Fabric dependency backing the Fabric
        // AutoConfig config screen. Scoped to the Cloth Config group so this
        // maven does not broaden resolution for anything else.
        maven {
            name = "shedaniel"
            url = "https://maven.shedaniel.me/"
            content { includeGroup "me.shedaniel.cloth" }
        }
    }

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    java {
        withSourcesJar()
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}

// ---- Automatic deployment (Modrinth + CurseForge) ----
//
// Publishing is configured PER LOADER in fabric/build.gradle and neoforge/build.gradle,
// so each release produces its own version per platform with loader-correct
// dependencies: fabric-api + cloth-config are required only on the Fabric version,
// while the NeoForge version requires just architectury-api. The two versions get
// distinct version numbers (`${mod_version}+fabric` / `+neoforge`) because Modrinth
// requires a unique version number per upload. `./gradlew publishMods` runs both.
//
// BEFORE the first publish you must:
//   1. Create the Modrinth + CurseForge projects.
//   2. Fill modrinth_project_id / curseforge_project_id in gradle.properties
//      (public IDs — committed, not secrets).
//   3. Provide account-wide tokens. CI: set MODRINTH_TOKEN / CURSEFORGE_TOKEN repo
//      secrets (env). Local: put modrinth_token / curseforge_token in your global
//      ~/.gradle/gradle.properties (never committed). Each block reads the env var
//      first, then falls back to the gradle property.
// `publishMods` publishes for real; pass -PpublishDryRun to stage without uploading.
