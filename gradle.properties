# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
# Minecraft 26.1 dropped obfuscation and bumped the toolchain to JAVA 25. Architectury
# Loom requires the Gradle daemon ITSELF to run on JDK 25 (not just a Java 25 toolchain).
# The system default `java` may be older, so the daemon JVM is pinned explicitly here.
# Adjust this path (or override in a non-committed gradle.properties /
# via -Dorg.gradle.java.home=) if your JDK 25 lives elsewhere.
org.gradle.java.home=C\:\\Users\\calvi\\.jdks\\temurin-25.0.3
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Architectury Loom is not yet compatible with the Gradle configuration cache.
org.gradle.configuration-cache=false

# Parchment is OBSOLETE on 26.1+: Minecraft 26.1 ships UNOBFUSCATED (official Mojang names
# ARE the runtime names), so there are no obfuscated parameter names left for Parchment to
# improve. The mappings block in build.gradle is dropped entirely.

# Minecraft
# 26.2 has no patch releases yet, so it is a single-version line (note the 2-segment version
# string — anything parsing this must not assume a patch segment exists).
minecraft_version=26.2
minecraft_version_range=[26.2,26.2.1)
# NeoForge uses a 4-part version tied to the exact MC patch. 26.2 only has a BETA NeoForge
# so far; there is no stable build to target yet.
neo_version=26.2.0.6-beta
neo_version_range=[26.2,)
loader_version_range=[4,)

# Architectury / multi-loader. Loom 1.17.483 and Architectury API 21.x are the 26.2 builds
