## Mod info
mod_version=1.0.1
mod_id=calamari
mod_group_id=com.phantomwing.calamari
mod_license=MIT License
mod_name=Calamari
mod_description=Squids and glow squids drop calamari, a vanilla-friendly seafood you can cook, trade, and eat.
mod_authors=PhantomWing

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
# Architectury Loom requires the Gradle daemon itself to run on JDK 21. The system
# default `java` may be an older JDK, so the daemon JVM is pinned explicitly here.
# Adjust this path (or override in a non-committed gradle.properties /
# via -Dorg.gradle.java.home=) if your JDK 21 lives elsewhere.
org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-21.0.7.6-hotspot
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Architectury Loom is not yet compatible with the Gradle configuration cache.
org.gradle.configuration-cache=false

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20

# Minecraft
# 1.21.11 is its own range (no sibling version shares its protocol).
minecraft_version=1.21.11
minecraft_version_range=[1.21.11,1.21.12)
neo_version=21.11.42
neo_version_range=[21.11,)
loader_version_range=[4,)

# Architectury / multi-loader
architectury_plugin_version=3.4.164
# The 1.21.4 line needs architectury-loom 1.10.x (1.7.x predates NeoForge 21.4's
# clientData/serverData run templates and fails to launch datagen).
architectury_loom_version=1.14.476
architectury_version=19.0.1
enabled_platforms=fabric,neoforge

# Fabric
fabric_loader_version=0.16.14
fabric_api_version=0.141.4+1.21.11

# Cloth Config (Fabric only) — backs the Fabric AutoConfig config screen.
# 17.0.144 is the Cloth Config build for the MC 1.21.4 line.
cloth_config_version=21.11.153

# Other dev-runtime dependencies.
# JEI: DROPPED on this branch — its 1.21.11 builds (27.21.x) are compiled with Loom
# 1.17.x, which architectury-loom 1.14.476 refuses to read ("Mod was built with a newer
# version of Loom"). The Silver Age 1.21.11 branch omits it for the same reason.
# AppleSkin: DROPPED on this branch — no 1.21.11 build exists for either loader.

# Publishing — Modrinth / CurseForge project IDs (PUBLIC identifiers, not secrets).
