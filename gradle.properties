# --- 26.1 PORT NOTES --------------------------------------------------------------
# 26.1 is the first UNOBFUSCATED Minecraft release, which changes the build fundamentally:
#   * `dev.architectury.loom-no-remap` replaces `dev.architectury.loom` — there is no
#     mappings dependency and no remapJar step. shadowJar becomes the primary mod artifact.
#   * The `mod`-prefixed dependency configurations (modImplementation / modApi /
#     modLocalRuntime) are gone; use plain implementation / api / localRuntime.
#   * The mixin annotation processor + refmap are gone (nothing to remap).
#   * Toolchain is Java 25 and Gradle 9.x.
# Gameplay-side, 26.1 rewrote VILLAGER TRADES from code (VillagerTrades.ItemListing +
# NeoForge's VillagerTradesEvent / Fabric's TradeOfferHelper) to a datapack `villager_trade`
# registry plus `tags/villager_trade/<profession>/level_N` pool tags. Calamari's two
# fisherman trades are therefore pure data now, shared by both loaders.
#
# --- 26.2 PORT NOTES --------------------------------------------------------------
# A small rename/reorg release on top of 26.1; the build setup is unchanged. Code changes:
#   * `EntityType` was renamed to `EntityTypes`.
#   * Datagen tag providers take a ResourceKey rather than the item/block itself, so
#     `tag(x).add(SOME_ITEM)` becomes `tag(x).add(SOME_ITEM.builtInRegistryHolder().key())`.
# NeoForge is still BETA-only for 26.2 (26.2.0.6-beta) — no stable build exists yet.

