# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
# Minecraft 26.1 dropped obfuscation and bumped the toolchain to JAVA 25. Architectury
# Loom requires the Gradle daemon ITSELF to run on JDK 25 (not just a Java 25 toolchain).
# The system default `java` may be older, so the daemon JVM is pinned explicitly here.
# Adjust this path (or override in a non-committed gradle.properties /
# via -Dorg.gradle.java.home=) if your JDK 25 lives elsewhere.
org.gradle.java.home=C\:\\Users\\calvi\\.jdks\\temurin-25.0.3
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Architectury Loom is not yet compatible with the Gradle configuration cache.
org.gradle.configuration-cache=false

# Parchment is OBSOLETE on 26.1+: Minecraft 26.1 ships UNOBFUSCATED (official Mojang names
# ARE the runtime names), so there are no obfuscated parameter names left for Parchment to
# improve. The mappings block in build.gradle is dropped entirely.

# Minecraft
# 26.1.2 is the last hotfix of the 26.1 line (Minecraft's new YY.N[.patch] versioning scheme,
# which replaced the 1.21.x line). The mod's content is unchanged across 26.1 / 26.1.1 /
# 26.1.2, so the manifest range spans the whole line while the BUILD target is the newest.
minecraft_version=26.1.2
minecraft_version_range=[26.1,26.1.3)
# NeoForge uses a 4-part version tied to the exact MC patch.
neo_version=26.1.2.75
neo_version_range=[26.1.2,)
loader_version_range=[4,)

# Architectury / multi-loader. architectury-loom 1.17.477 is the first loom supporting the
# 26.1 (unobfuscated, Java 25, Gradle 9.x) toolchain. Architectury API jumped to 20.x for
# 26.1 (was 19.0.1 on 1.21.11); the architectury-plugin moved to 3.5.x.
architectury_plugin_version=3.5.167
architectury_loom_version=1.17.477
architectury_version=20.0.5
enabled_platforms=fabric,neoforge

# Fabric
fabric_loader_version=0.19.3
fabric_api_version=0.151.0+26.1.2

# Cloth Config (Fabric only) — backs the Fabric AutoConfig config screen.
# 26.1.154 is the 26.1 build (was 21.11.153 on 1.21.11).
cloth_config_version=26.1.154

# Other dev-runtime dependencies.
