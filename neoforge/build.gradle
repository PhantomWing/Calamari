plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

architectury {
    platformSetupLoomIde()
    neoForge {
    }
}

// Resolved outside the loom { runs { } } closures so the data-generation paths
// are available to the RunConfigSettings delegate.
def datagenModId = rootProject.property('mod_id').toString()
def datagenOutput = rootProject.file('common/src/generated/resources/').absolutePath
def datagenExisting = rootProject.file('common/src/main/resources/').absolutePath

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    // Include the test-only source set in the dev mod definition so NeoForge's
    // @GameTestHolder scan discovers the game tests. This only affects the dev
    // runtime mod — the production jar is still built from `main` only, so the
    // test class + empty.nbt structure never ship.
    mods {
        register('calamari') {
            sourceSet sourceSets.main
            sourceSet sourceSets.test
        }
    }

    runs {
        // NeoForge data generation. Output + existing-resource paths point at the
        // common source set (datagen output is shared across loaders).
        //   ./gradlew :neoforge:runData
        data {
            data()
            name = "Data Generation"
            programArgs('--mod', datagenModId, '--all', '--output', datagenOutput, '--existing', datagenExisting)
        }

        // Headless NeoForge game-test server: runs every registered @GameTest in
        // the `calamari` namespace, prints PASS/FAIL, and exits. Gametest mode is
        // toggled via system properties (same as NeoForge's own gameTestServer run),
        // NOT a program arg.
        //   ./gradlew :neoforge:runGameTest
        gameTest {
            server()
            name = "Game Test"
            runDir "run/gametest"
            // Run from the test-only source set so the test class + empty.nbt
            // structure never ship in the production jar.
            source sourceSets.test
            property 'neoforge.enableGameTest', 'true'
            property 'neoforge.gameTestServer', 'true'
            property 'neoforge.enabledGameTestNamespaces', 'calamari'
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

// Test-only source set for game tests (NeoForge GLM loot verification). Kept out
// of the main source set so neither the test class nor its empty.nbt structure
// ship in the production jar. It inherits main's full compile/runtime classpath
// (Minecraft, NeoForge, Architectury, the common project) plus main's output.
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neo_version}"
    // Architectury API (NeoForge).
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive false }

    // ---- Dev-runtime niceties (modLocalRuntime ONLY — never compiled against,
    //      never shipped, never a hard dependency). ----
    modLocalRuntime("mezz.jei:jei-1.21.1-neoforge:${rootProject.jei_version}")
    modLocalRuntime("squeek.appleskin:appleskin-neoforge:mc1.21-${rootProject.appleskin_version}")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

shadowJar {
    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = "${rootProject.mod_id}-neoforge"
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}
