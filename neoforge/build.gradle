plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

architectury {
    platformSetupLoomIde()
    neoForge {
    }
}

// Resolved outside the loom { runs { } } closures so the data-generation paths
// are available to the RunConfigSettings delegate.
def datagenModId = rootProject.property('mod_id').toString()
def datagenOutput = rootProject.file('common/src/generated/resources/').absolutePath
def datagenExisting = rootProject.file('common/src/main/resources/').absolutePath

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    // Include the test-only source set in the dev mod definition so NeoForge's
    // @GameTestHolder scan discovers the game tests. This only affects the dev
    // runtime mod — the production jar is still built from `main` only, so the
    // test class + empty.nbt structure never ship.
    mods {
        register('calamari') {
            sourceSet sourceSets.main
            sourceSet sourceSets.test
        }
    }

    runs {
        // NeoForge data generation. Output + existing-resource paths point at the
        // common source set (datagen output is shared across loaders).
        //   ./gradlew :neoforge:runData
        // NeoForge 21.4 split the old single `data` run template into `clientData` +
        // `serverData` (loom's data() maps to the now-removed `data` template, which
        // fails to launch). clientData()'s environment is a superset (full client), so
        // one run with --all emits BOTH the client model providers and the server data.
        data {
            clientData()
            name = "Data Generation"
            programArgs('--mod', datagenModId, '--all', '--output', datagenOutput, '--existing', datagenExisting)
        }

        // Headless NeoForge game-test server: runs every registered @GameTest in
        // the `calamari` namespace, prints PASS/FAIL, and exits. Gametest mode is
        // toggled via system properties (same as NeoForge's own gameTestServer run),
        // NOT a program arg.
        //   ./gradlew :neoforge:runGameTest
        gameTest {
            // NeoForge 21.5 selects gametest mode from the LAUNCH TARGET
            // (`neoforgegametestserverdev`, see GameTestHooks#isGametestServer) — the old
            // `neoforge.gameTestServer` property no longer switches modes. Loom derives
            // that target from `environment`, so the environment string MUST equal the
            // forge template name (every built-in helper sets both, e.g. server() =>
            // environment "server" + forgeTemplate "server"). Setting only the template
            // leaves the run on `neoforgeserverdev` and it just boots an idle server.
            environment "gameTestServer"
            forgeTemplate "gameTestServer"
            name = "Game Test"
            runDir "run/gametest"
            // Run from the test-only source set so the test classes + empty.nbt
            // structure never ship in the production jar.
            source sourceSets.test
            // Declare BOTH source sets as the mod *for this run only*, so NeoForge treats
            // the test output as mod content: it scans CalamariGameTests'
            // @EventBusSubscriber (registering the TEST_FUNCTION entries) and loads the
            // test_instance / structure datapack resources.
            mods {
                "${rootProject.mod_id}" {
                    sourceSet sourceSets.main
                    sourceSet sourceSets.test
                }
            }
            // Run ONLY this mod's tests (a /test-style selector), so a future built-in
            // vanilla test can't break this run.
            programArgs '--tests', "${rootProject.mod_id}:*"
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

// Test-only source set for game tests (NeoForge GLM loot verification). Kept out
// of the main source set so neither the test class nor its empty.nbt structure
// ship in the production jar. It inherits main's full compile/runtime classpath
// (Minecraft, NeoForge, Architectury, the common project) plus main's output.
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neo_version}"
    // Architectury API (NeoForge).
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive false }

    // ---- Dev-runtime niceties (modLocalRuntime ONLY — never compiled against,
    //      never shipped, never a hard dependency). ----
    // JEI has no 1.21.6 build, so only AppleSkin is wired up here.
    modLocalRuntime("squeek.appleskin:appleskin-neoforge:${rootProject.appleskin_neoforge_version}")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

shadowJar {
    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = "${rootProject.mod_id}-neoforge"
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}

// ---- Modrinth + CurseForge publishing (NeoForge jar) ----
//
// Its own version, requiring only architectury-api (fabric-api and cloth-config are
// Fabric-only and live on the Fabric version). Platforms distinguish this from the
// Fabric version by loader + game-version tags (and the distinct file name), so no
// version-number suffix is needed. Dry-run unless a token is set.
apply plugin: 'me.modmuss50.mod-publish-plugin'

publishMods {
    type = STABLE
    file = remapJar.archiveFile
    version = rootProject.mod_version
    changelog = rootProject.ext.latestChangelog()
    // Real publish by default; pass -PpublishDryRun to stage without uploading.
    dryRun = project.hasProperty("publishDryRun")
    modLoaders.add("neoforge")

    modrinth {
        projectId = providers.gradleProperty("modrinth_project_id")
                .orElse(providers.environmentVariable("MODRINTH_PROJECT_ID")).orElse("PLACEHOLDER")
        accessToken = providers.environmentVariable("MODRINTH_TOKEN").orElse(providers.gradleProperty("modrinth_token"))
        displayName = "Calamari ${rootProject.mod_version}"
        minecraftVersions.add(rootProject.minecraft_version)
        requires("architectury-api")
    }

    curseforge {
        projectId = providers.gradleProperty("curseforge_project_id")
                .orElse(providers.environmentVariable("CURSEFORGE_PROJECT_ID")).orElse("PLACEHOLDER")
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse(providers.gradleProperty("curseforge_token"))
        displayName = "Calamari ${rootProject.mod_version}"
        minecraftVersions.add(rootProject.minecraft_version)
        // CurseForge needs explicit side flags (Modrinth uses `environment` above).
        client = true
        server = true
        requires("architectury-api")
    }
}
