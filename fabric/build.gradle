plugins {
    // johnrengelman's shadow is abandoned + Gradle-9 incompatible; com.gradleup.shadow is the
    // maintained fork. With loom-no-remap (26.1) there is no remapJar, so shadowJar becomes
    // the PRIMARY mod artifact (it bundles :common into the jar).
    id 'com.gradleup.shadow' version '9.4.2'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

// 26.1: the mixin annotation processor is OFF by default (unobfuscated names need no
// refmap remapping). The old `mixin { defaultRefmapName = ... }` block is gone; the
// loot-replacement mixin still applies at runtime via calamari.mixins.json (whose
// `refmap` entry is dropped).

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    // 26.1/loom-no-remap: plain configs (no `mod` prefix — nothing is remapped).
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    // Architectury API (Fabric).
    api "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

    // `namedElements` no longer exists under loom-no-remap — reference :common directly.
    common(project(path: ':common')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive false }

    // Cloth Config — a real (compiled + shipped) Fabric dependency: it backs the
    // Fabric AutoConfig config screen (CalamariFabricConfig). fabric-api excluded
    // to avoid a transitive downgrade.
    implementation("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }

    // ---- Dev-runtime niceties (modLocalRuntime ONLY — never compiled against,
    //      never shipped, never a hard dependency). ----
}

processResources {
    // Properties expanded into fabric.mod.json — keep these in sync with the
    // dependency versions in gradle.properties so the published jar pins to
    // exactly the versions we compiled against (minimums for fabric-api / loader /
    // architectury / cloth-config, plus the Minecraft version range).
    def fmjProps = [
            version              : project.version,
            fabric_loader_version: rootProject.fabric_loader_version,
            fabric_api_version   : rootProject.fabric_api_version,
            minecraft_version_range: convertMavenRangeToFabricRange(rootProject.minecraft_version_range),
            architectury_version : rootProject.architectury_version,
            cloth_config_version : rootProject.cloth_config_version,
    ]
    inputs.properties fmjProps

    filesMatching('fabric.mod.json') {
        expand fmjProps
    }
}

/**
 * Convert a Maven-style version range like {@code [1.21,1.21.2)} to the
 * Fabric-style range used in {@code fabric.mod.json} ({@code >=1.21 <1.21.2}).
 * Lets both loaders read the same {@code minecraft_version_range} property in
 * {@code gradle.properties}.
 */
static String convertMavenRangeToFabricRange(String mavenRange) {
    def m = (mavenRange =~ /^\[([^,\]]+),([^\)\]]+)\)$/)
    if (m.matches()) {
        return ">=${m[0][1]} <${m[0][2]}"
    }
    return mavenRange
}

// 26.1/loom-no-remap: there is no remapJar. The default `jar` is loom-processed (it injects
// Jar-in-Jar metadata into fabric.mod.json) but is NOT shippable on its own — it lacks
// :common. We mark it `raw` and build shadowJar ON TOP of its output (NOT from source), so
// the Loom-modified fabric.mod.json is preserved while :common is merged in. shadowJar then
// becomes the primary (unclassified) mod jar.
jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn jar
    // Build from the Loom-processed jar output, not the raw source set — otherwise shadow
    // would overwrite Loom's fabric.mod.json (with its JiJ entries) with the unprocessed one.
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))

    exclude 'architectury.common.json'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
}

// shadowJar is the shippable jar, so it has to be built as part of `assemble`.
assemble.dependsOn shadowJar

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

// 26.1/loom-no-remap + Shadow: shadowJar (not jar) is the shippable artifact, so redirect the
// java component's outgoing artifacts to it. Otherwise `from components.java` would publish
// the classifier='raw' jar (which lacks :common). Maven publishing is scaffolding here (no
// repositories are configured) but components.java must still resolve at configuration time.
configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = "${rootProject.mod_id}-fabric"
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}

// ---- Modrinth + CurseForge publishing (Fabric jar) ----
//
// Its own version, so fabric-api and cloth-config are required only on the Fabric
// download. Platforms distinguish this from the NeoForge version by loader +
// game-version tags (and the distinct file name), so no version-number suffix is
// needed. Dry-run unless a token is set.
apply plugin: 'me.modmuss50.mod-publish-plugin'

publishMods {
    type = STABLE
    file = shadowJar.archiveFile
    version = rootProject.mod_version
    changelog = rootProject.ext.latestChangelog()
    // Real publish by default; pass -PpublishDryRun to stage without uploading.
    dryRun = project.hasProperty("publishDryRun")
    modLoaders.add("fabric")

    modrinth {
        projectId = providers.gradleProperty("modrinth_project_id")
                .orElse(providers.environmentVariable("MODRINTH_PROJECT_ID")).orElse("PLACEHOLDER")
        accessToken = providers.environmentVariable("MODRINTH_TOKEN").orElse(providers.gradleProperty("modrinth_token"))
        displayName = "Calamari ${rootProject.mod_version}"
        minecraftVersions.add(rootProject.minecraft_version)
        requires("architectury-api")
        requires("fabric-api")
        requires("cloth-config")
    }

    curseforge {
        projectId = providers.gradleProperty("curseforge_project_id")
                .orElse(providers.environmentVariable("CURSEFORGE_PROJECT_ID")).orElse("PLACEHOLDER")
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse(providers.gradleProperty("curseforge_token"))
        displayName = "Calamari ${rootProject.mod_version}"
        minecraftVersions.add(rootProject.minecraft_version)
        // CurseForge needs explicit side flags (Modrinth uses `environment` above).
        client = true
        server = true
        requires("architectury-api")
        requires("fabric-api")
        requires("cloth-config")
    }
}
